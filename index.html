<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>冯训琦 · 前端开发工程师 · 个人简历</title>

<meta name="description" content="冯训琦 — 前端开发工程师个人简历,支持在线预览与 PDF 下载。">
<meta name="author" content="冯训琦">
<meta name="robots" content="index, follow">
<meta name="theme-color" content="#4f46e5">
<link rel="canonical" href="./">

<meta property="og:type" content="profile">
<meta property="og:title" content="冯训琦 · 前端开发工程师">
<meta property="og:description" content="前端开发工程师个人简历,支持在线预览与 PDF 下载。">
<meta property="og:locale" content="zh_CN">

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%234f46e5'/><text x='50' y='70' font-size='58' font-family='system-ui' font-weight='700' fill='white' text-anchor='middle'>冯</text></svg>">

<style>
  :root {
    --indigo: #4f46e5;
    --indigo-dark: #4338ca;
    --ink: #16181d;
    --muted: #6b7280;
    --line: #e5e7eb;
    --bg: #f5f6f9;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    padding: 32px 20px 48px;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    line-height: 1.6;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .card {
    width: 100%;
    max-width: 900px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 28px;
    box-shadow: 0 8px 28px rgba(19, 22, 31, .06);
  }

  header { text-align: center; }

  .avatar {
    width: 60px;
    height: 60px;
    margin: 0 auto 14px;
    border-radius: 16px;
    background: var(--indigo);
    color: #fff;
    font-size: 26px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    letter-spacing: 1px;
  }

  h1 {
    margin: 0 0 6px;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: .5px;
  }

  .role {
    margin: 0 0 18px;
    color: var(--muted);
    font-size: 15px;
  }

  .role::before,
  .role::after {
    content: "";
    display: inline-block;
    width: 22px;
    height: 1px;
    background: var(--line);
    vertical-align: middle;
    margin: 0 10px;
  }

  .actions {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 24px;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 11px 22px;
    border-radius: 9px;
    font-size: 14.5px;
    font-weight: 500;
    text-decoration: none;
    transition: background .18s, border-color .18s, transform .18s;
  }

  .btn:active { transform: translateY(1px); }

  .btn-primary {
    background: var(--indigo);
    color: #fff;
  }
  .btn-primary:hover { background: var(--indigo-dark); }

  .btn-ghost {
    background: #fff;
    color: var(--ink);
    border: 1px solid var(--line);
  }
  .btn-ghost:hover { border-color: #c9cdd6; }

  .frame {
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
    background: #fafbfc;
  }

  .frame { position: relative; }

  .frame object,
  .frame iframe {
    display: block;
    width: 100%;
    height: 78vh;
    min-height: 500px;
    border: 0;
  }

  /* 兜底提示:仅在 PDF 尚未加载完成时可见 */
  .fallback {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 44px 24px;
    text-align: center;
    color: var(--muted);
    font-size: 14.5px;
    line-height: 1.9;
    pointer-events: none;
  }

  .frame > iframe { position: relative; }

  .fallback a { color: var(--indigo); }

  footer {
    margin-top: 20px;
    color: #9aa0aa;
    font-size: 12.5px;
    text-align: center;
  }

  @media (max-width: 640px) {
    body { padding: 18px 12px 32px; }
    .card { padding: 22px 16px; border-radius: 13px; }
    h1 { font-size: 22px; }
    .frame object, .frame iframe { height: 66vh; min-height: 380px; }
    .btn { flex: 1 1 auto; justify-content: center; }
  }

  @media print {
    body { background: #fff; padding: 0; }
    .card { border: 0; box-shadow: none; padding: 0; max-width: none; }
    .actions, footer { display: none; }
    .frame { border: 0; }
  }
</style>
</head>

<body>
<div class="card">
  <header>
    <div class="avatar">冯</div>
    <h1>冯训琦</h1>
    <p class="role">前端开发工程师</p>
  </header>

  <div class="actions">
    <a class="btn btn-primary" id="dl" href="./resume.pdf" download>下载 PDF 简历</a>
    <a class="btn btn-ghost" id="op" href="./resume.pdf" target="_blank" rel="noopener">在新窗口打开</a>
  </div>

  <div class="frame">
    <div class="fallback" id="fb">简历加载中…</div>
    <iframe id="viewer" src="./resume.pdf" title="冯训琦 · 前端开发工程师 · 简历"></iframe>
  </div>
</div>

<footer>本页仅用于简历展示 · 支持手机与电脑直接查看</footer>

<script>
(function () {
  // PDF 走 jsDelivr CDN,实测国内 3.2–3.4s;GitHub Pages 直连需 13s 以上
  var CDN = 'https://cdn.jsdelivr.net/gh/Fengx77/resume@main/resume.pdf';
  var ORIGIN = './resume.pdf';

  var viewer = document.getElementById('viewer');
  var fb = document.getElementById('fb');
  var dl = document.getElementById('dl');
  var op = document.getElementById('op');
  var settled = false;

  function useFallback() {
    if (settled) return;
    settled = true;
    viewer.src = ORIGIN;
    dl.href = ORIGIN;
    op.href = ORIGIN;
    fb.textContent = 'CDN 未响应,已切换到备用线路,请稍候…';
  }

  viewer.addEventListener('load', function () {
    settled = true;
    fb.style.display = 'none';
  });

  viewer.src = CDN;
  dl.href = CDN;
  op.href = CDN;

  // CDN 在部分网络下可能被拦,5 秒未加载完就回落到 GitHub Pages
  setTimeout(function () {
    if (!settled) useFallback();
  }, 5000);
})();
</script>
</body>
</html>
